
# Achroma configuration
 
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=y
 
# P0.06 is used for the LED data line, so keep the UART off
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
 
# RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Required: this board build has no ext-power device for the underglow driver to use
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Brightness 0-100. Lower = dimmer. Each brightness key press changes it by BRT_STEP.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
 
# Starting color (hue 0-359, saturation 0-100). 240 = blue.
# Other hues: 0 red, 30 orange, 60 yellow, 120 green, 180 cyan, 270 purple, 300 magenta, 330 pink
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=10
 