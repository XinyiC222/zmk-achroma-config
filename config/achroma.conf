# Increase Bluetooth transmission power to eliminate split dropouts
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep functions to save battery power
CONFIG_ZMK_SLEEP=y

# Go to deep sleep after 15 minutes of idling (in milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Defines the identity of your keyboard over Bluetooth
CONFIG_ZMK_KEYBOARD_NAME="Achroma Split"