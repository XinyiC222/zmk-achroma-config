# Achroma configuration

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=y

# P0.06 is used for the LED data line, so keep the UART off
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# RGB underglow (the LEDs are powered from the controller's switched VCC rail,
# so leave the default ext-power handling ON; do not set UNDERGLOW_EXT_POWER=n)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
